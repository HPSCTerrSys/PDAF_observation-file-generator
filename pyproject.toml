[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pdaf-observation-file-generator"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "netCDF4",
    "gitpython",
    "xarray",
    "cdsapi",
]

[tool.setuptools]
packages = []
